# Starter stat weights for levelling, used by compare_items.
#
# Confidence: LOW. These are Classic 1.12 rules of thumb (strength to attack power, agility to crit and so on)
# tuned for solo levelling, where stamina and staying alive matter more than at max level. Forever rebalanced
# talents and may have changed conversions. Treat a close result (within ~5%) as a tie.
# Pass your own weights to compare_items to override any of these, and send a pull request when you find
# better numbers.
#
# Units: physical specs score in "attack power equivalents", casters in "spell power equivalents".
# crit, hit, spell_crit and spell_hit are per 1%. weapon_dps is per 1 DPS on the main hand.
# Keys: str agi sta int spi ap rap sp heal crit hit spell_crit spell_hit mp5 armor def dodge block weapon_dps

