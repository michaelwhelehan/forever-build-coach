name: Probe ForeverDB addon data
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir d && cd d
          curl -sS -A forever-route-builder https://foreverdb.net/downloads/addon-manifest.json -o manifest.json
          python3 - <<'PY'
          import json,urllib.request
          m=json.load(open('manifest.json'))
          def get(u): return urllib.request.urlopen(urllib.request.Request('https://foreverdb.net/'+u,headers={'User-Agent':'forever-route-builder'})).read()
          for f in m['data']['files']:
              name=f['path'].split('/')[-1]
              if name in ('QuestClassic.lua','QuestForever.lua','QuestXP.lua','Zones.lua','RouteMaps.lua','Quests.lua','QuestOffers.lua','Travel.lua'):
                  open(name,'wb').write(get(f['url']))
          open('fdb.zip','wb').write(get(m['addon']['url']))
          PY
          unzip -l fdb.zip | head -20
          for t in $(unzip -Z1 fdb.zip | grep -i '\.toc$'); do echo "== $t"; unzip -p fdb.zip "$t" | head -15; done
          tar czf data.tgz *.lua
          ls -la
          echo BEGIN_DATA
          base64 -w 200 data.tgz
          echo END_DATA
