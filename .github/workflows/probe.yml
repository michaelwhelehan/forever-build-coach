name: Probe ForeverDB addon data
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -x
          mkdir d && cd d
          curl -sS -A "forever-route-builder" https://foreverdb.net/downloads/addon-manifest.json -o manifest.json
          head -c 600 manifest.json; echo
          for f in QuestClassic QuestForever QuestXP Quests Starts NPCs Zones LevelRoutes SpecialQuests Routes_1 Coach Travel QuestGuide Dungeons; do
            url=$(python3 -c "import json,sys;m=json.load(open('manifest.json'));print([x['url'] for x in m['data']['files'] if x['path'].endswith('/$f.lua')][0])" 2>/dev/null || python3 -c "import json;m=json.load(open('manifest.json'));print(json.dumps(m['data'])[:800])")
            echo "=== $f $url"
            curl -sS -A "forever-route-builder" "https://foreverdb.net/$url" -o $f.lua || true
            wc -c $f.lua; wc -l $f.lua
            head -c 2500 $f.lua | cut -c1-400; echo
            echo "--- grep 4641/790/840"
            grep -o -E '.{0,120}\[(4641|790|840)\].{0,250}' $f.lua | head -4
          done
          echo "=== Starts structure sample mid"
          sed -n '50,60p' Starts.lua | cut -c1-500
          echo "=== QuestClassic counts"
          grep -c '^\s*\[' QuestClassic.lua; grep -c '^\s*\[' QuestForever.lua
          grep -o -E '\[[0-9]+\]="[^"]*\|h\|' QuestClassic.lua | wc -l
